name: CI y despliegue

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # Activar `cache: npm` cuando exista package-lock.json en el repo.

      - name: Instalar dependencias
        # `npm ci` en cuanto se suba package-lock.json (builds reproducibles).
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Comprobar tipos
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Verificar que el motor está en el build
        run: |
          test -f dist/engine/manifest.json
          cat dist/engine/manifest.json
          ls -la dist/engine

      - name: Navegador para la prueba e2e
        run: npx playwright install --with-deps chromium

      - name: Prueba e2e (móvil y escritorio)
        run: npm run e2e

      - name: Subir artefacto para GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    # Requiere: Settings → Pages → Source: "GitHub Actions" (una sola vez).
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
